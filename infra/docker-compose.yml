name: ghostwright

services:
  # Application datastore — libSQL server (sqld). The sole app datastore.
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:latest
    platform: linux/amd64
    environment:
      SQLD_NODE: primary
    ports:
      - "8180:8080"
      - "5501:5001"
    volumes:
      - ./data/libsql:/var/lib/sqld

  # Queue backend for BullMQ (queue only — never application data).
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Artifact store (screenshots, trace.zip, video, HAR).
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data

  # One-shot: create the artifacts bucket on boot, then exit.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio...'; sleep 1;
      done;
      mc mb --ignore-existing local/artifacts;
      echo 'artifacts bucket ready';
      exit 0;
      "

  # Containerized Playwright worker. Started only with `--profile worker` (host runs
  # are used for local dev). `ipc: host` prevents Chromium from crashing on /dev/shm.
  worker:
    build:
      context: ..
      dockerfile: infra/worker.Dockerfile
    profiles: ["worker"]
    ipc: host
    environment:
      DATABASE_URL: http://libsql:8080
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: artifacts
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    depends_on:
      - libsql
      - redis
      - minio
